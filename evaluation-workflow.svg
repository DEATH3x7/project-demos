<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" role="img" aria-labelledby="title desc"><title id="title">Agent evaluation workflow</title><desc id="desc">Case JSON and model dialogues feed patient, doctor interview and clinical output evaluation, then validation, aggregation and reports.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#637b76" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="10" y="10" width="450" height="62" fill="#f8fbfa" stroke="#8ca49c" /><text x="235.0" y="30.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#183a34">Case JSON</text><text x="235.0" y="52.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#183a34">Clinical facts + evaluation references</text><rect x="500" y="10" width="450" height="62" fill="#f8fbfa" stroke="#8ca49c" /><text x="725.0" y="30.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#183a34">Model dialogues</text><text x="725.0" y="52.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#183a34">Patient–doctor exchanges</text><path d="M235 72 V96" fill="none" stroke="#637b76" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M725 72 V96" fill="none" stroke="#637b76" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="10" y="96" width="940" height="50" fill="#f8fbfa" stroke="#8ca49c" /><text x="480.0" y="121.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#183a34">Align cases and visits; freeze shared benchmarks</text><path d="M480 146 V165 H160 V187" fill="none" stroke="#6