<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Clinical data extraction workflow</title><desc id="desc">Clinical workbooks become patient-accessible facts and separate evaluation-only benchmarks. Benchmarks are withheld from both agents.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#637b76" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="180" y="10" width="600" height="50" fill="#f8fbfa" stroke="#8ca49c" /><text x="480.0" y="35.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#183a34">Clinical Excel workbook</text><path d="M480 60 V84" fill="none" stroke="#637b76" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="10" y="84" width="940" height="50" fill="#f8fbfa" stroke="#8ca49c" /><text x="480.0" y="109.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#183a34">Extract, normalize, link by time, and validate</text><path d="M235 134 V174" fill="none" stroke="#637b76" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M725 134 V174" fill="none" stroke="#637b76" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="174" width="450" height="84" fill="#f8fbfa" stroke="#8ca49c" /><text x="235.0" y="194.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#183a34">Patient-facing JSON</text><text x="235.0" y="216.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#183a34">History, visits, linked clinical facts</text><text x="235.0" y="238.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#183a34">Read by Patient Agent</text><rect x="500" y="174" width="450" height="84" fill="#f8fbfa" stroke="#8ca49c" stroke-dasharray="6 4"/><text x="725.0" y="194.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#183a34">Evaluation-only JSON</text><text x="725.0" y="216.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#183a34">Reference diagnoses and management</text><text x="725.0" y="238.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#183a34">Read by Evaluator only</text><path d="M235 258 V310" fill="none" stroke="#637b76" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M725 258 V310" fill="none" stroke="#637b76" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="310" width="450" height="80" fill="#f8fbfa" stroke="#8ca49c" /><text x="235.0" y="339.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#183a34">Patient Agent ↔ Doctor Agent</text><text x="235.0" y="361.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#183a34">Simulated consultation</text><rect x="500" y="310" width="450" height="80" fill="#f8fbfa" stroke="#8ca49c" /><text x="725.0" y="339.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#183a34">Evaluator</text><text x="725.0" y="361.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#183a34">Compare outputs against benchmarks</text><path d="M460 350 H500" fill="none" stroke="#637b76" stroke-width="1.5" marker-end="url(#arrow)"/></svg>